# Copy to .pixi/config.toml and substitute the site's URLs before pixi install.
# Exact mirror mappings do not fall back to the original host unless it is
# explicitly included in these lists.
[mirrors]
"https://conda.anaconda.org/conda-forge" = ["https://packages.example.internal/conda-forge"]
"https://conda.anaconda.org/bioconda" = ["https://packages.example.internal/bioconda"]
