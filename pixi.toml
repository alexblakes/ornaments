[workspace]
name = "ornaments"
version = "1.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.80.0"

[dependencies]
python = "3.11.*"
numpy = ">=2,<3"
biopython = ">=1.81,<2"
pandas = ">=2,<3"
gtfparse = ">=2.5,<3"
cmake = ">=3.18,<4"
ninja = "*"
make = "*"
autoconf = "2.69.*"
cxx-compiler = "*"
zlib = "*"
bzip2 = "*"
xz = "*"
setuptools = ">=61"
wheel = "*"
python-build = "*"
pip = "*"
pytest = ">=8,<10"

[tasks]
install-package = "python -m pip install . --no-deps --no-build-isolation --no-index"
ornaments = "ornaments"
test = "python -m pytest"
example-workflow = "python tests/run_example_workflow.py"
build-package = "python -m build --no-isolation"
