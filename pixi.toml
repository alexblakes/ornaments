[workspace]
name = "ornaments"
version = "1.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "osx-64", "osx-arm64"]
requires-pixi = ">=0.80.0"

# Replace the default external name mapping with local, explicit mappings.
# This avoids requests to conda-mapping.prefix.dev in restricted environments.
[workspace.conda-pypi-map]
conda-forge = { mapping-mode = "replace", mapping = { python-build = "build" } }
bioconda = { mapping-mode = "replace" }

[dependencies]
python = "3.11.*"
numpy = ">=2,<3"
biopython = ">=1.81,<2"
pandas = ">=2,<3"
cmake = ">=3.18,<4"
ninja = "*"
make = "*"
autoconf = "2.69.*"
cxx-compiler = "*"
zlib = "*"
bzip2 = "*"
xz = "*"
scikit-build-core = ">=0.10,<1"
python-build = "*"
pip = "*"
pytest = ">=8,<10"

[pypi-dependencies]
gtfparse = ">=2.5,<3"
ornaments = { path = "." }

[pypi-options]
no-build-isolation = ["ornaments"]

[tasks]
ornaments = "ornaments"
test = "python -m pytest"
example-workflow = "python tests/run_example_workflow.py"
build-package = "python -m build --no-isolation"
