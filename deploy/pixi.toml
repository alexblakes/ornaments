[workspace]
name = "ornaments-runtime"
version = "1.1.0"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]
requires-pixi = ">=0.80.0"

[dependencies]
python = "3.11.*"
numpy = ">=2,<3"
biopython = ">=1.81,<2"
pandas = ">=2,<3"
gtfparse = ">=2.5,<3"
zlib = "*"
bzip2 = "*"
xz = "*"
libstdcxx-ng = "*"
libgcc-ng = "*"
pip = "*"

[tasks]
install-wheel = "python -m pip install --no-deps --no-index artifacts/*.whl"
ornaments = "ornaments"
