# Optional Conda environment for running the source helper scripts.
# Prefer pixi.toml for installing the complete CLI and native engine.
name: ornaments
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.11
  - numpy>=2,<3
  - biopython>=1.81,<2
  - pandas>=2,<3
  - gtfparse>=2.5,<3
